<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌤️ Weather App</h1>
            <p>Search for any city to get current weather and forecast</p>
        </header>

        <div class="search-box">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name..."
                autocomplete="off"
            >
            <button id="searchBtn">Search</button>
        </div>

        <div id="error" class="error hidden"></div>
        <div id="loading" class="loading hidden">Loading...</div>

        <div id="currentWeather" class="current-weather hidden">
            <div class="weather-header">
                <h2 id="cityName"></h2>
                <p id="date"></p>
            </div>

            <div class="weather-main">
                <div class="temperature">
                    <span id="temp" class="temp-value"></span>
                    <span class="temp-unit">°C</span>
                </div>
                <div class="weather-icon">
                    <img id="weatherIcon" src="" alt="Weather icon">
                    <p id="description"></p>
                </div>
            </div>

            <div class="weather-details">
                <div class="detail">
                    <span class="detail-label">Feels Like</span>
                    <span id="feelsLike" class="detail-value"></span>
                </div>
                <div class="detail">
                    <span class="detail-label">Humidity</span>
                    <span id="humidity" class="detail-value"></span>
                </div>
                <div class="detail">
                    <span class="detail-label">Wind Speed</span>
                    <span id="windSpeed" class="detail-value"></span>
                </div>
                <div class="detail">
                    <span class="detail-label">Pressure</span>
                    <span id="pressure" class="detail-value"></span>
                </div>
            </div>
        </div>

        <div id="forecast" class="forecast hidden">
            <h3>5-Day Forecast</h3>
            <div id="forecastCards" class="forecast-cards"></div>
        </div>
    </div>

    <footer>
        <p>Weather data provided by <a href="https://openweathermap.org/" target="_blank">OpenWeatherMap</a></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
